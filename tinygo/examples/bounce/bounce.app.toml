# The SDK's bounce example (tinygo/examples/bounce). Put it next to
# bounce.app.wasm, both in a directory under /app (the directory is the
# launcher's category).
app_screen_name = "TinyGo bounce"
language = "tinygo"
default_window_mode = "window"
default_window_width = 180
default_window_height = 120
default_window_pos_x = 30
default_window_pos_y = 30
